<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma Page Web</title>
    <style>
        /* Style général */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-color: #f4f4f9;
            color: #333;
            line-height: 1.6;
        }

        /* En-tête */
        header {
            background-color: #2c3e50;
            color: #ffffff;
            text-align: center;
            padding: 2rem 1rem;
        }

        /* Conteneur principal */
        main {
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        /* Sections */
        section {
            background-color: #ffffff;
            margin-bottom: 2rem;
            padding: 1.5rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h2 {
            color: #2c3e50;
            margin-top: 0;
        }

        /* Images et Vidéos adaptatives */
        img, video {
            max-width: 100%;
            height: auto;
            border-radius: 6px;
            display: block;
            margin: 1rem 0;
        }

        /* Pied de page (Footer) */
        footer {
            background-color: #2c3e50;
            color: #ffffff;
            text-align: center;
            padding: 1.5rem 1rem;
            margin-top: 2rem;
        }

        footer a {
            color: #1abc9c;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- En-tête de la page -->
    <header>
        <h1>Bienvenue sur mon site Web</h1>
        <p>Découvrez notre contenu multimédia</p>
    </header>

    <!-- Contenu principal -->
    <main>
        
        <!-- Section Image -->
        <section id="image-section">
            <h2>Section Image</h2>
            <p>Voici une illustration de paysage magnifique :</p>
            <img src="https://picsum.photos/800/400" alt="Exemple d'image de paysage">
        </section>

        <!-- Section Vidéo -->
        <section id="video-section">
            <h2>Section Vidéo</h2>
            <p>Visionnez la vidéo ci-dessous :</p>
            <video controls poster="https://picsum.photos/800/400?blur">
                <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
                Votre navigateur ne supporte pas la lecture de vidéos HTML5.
            </video>
        </section>

    </main>

    <!-- Pied de page (Footer) -->
    <footer>
        <p>&copy; 2026 MonSiteWeb. Tous droits réservés.</p>
        <p>
            <a href="#">Politique de confidentialité</a> | 
            <a href="#">Conditions d'utilisation</a> | 
            <a href="#">Contact</a>
        </p>
    </footer>

</body>
</html>
